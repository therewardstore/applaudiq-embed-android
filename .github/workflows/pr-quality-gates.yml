# Generated by orbit (orbit ci install). Do not edit: `./orbit ci install` rewrites it.
# PR quality gates: every pull request title is `<KEY>: <Summary>` (a squash merge makes it the commit on the
# default branch). The rule is src/prtitle.js in the orbit repo, written out here in bash. It runs from the PR's own
# branch, so only same-repo PRs are retitled: their authors can already edit any workflow on that branch.
name: PR quality gates

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to retitle
        required: true

concurrency:
  group: pr-quality-gates-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-title:
    # A fork's token cannot edit the PR: its author retitles it. A manual run retitles the PR it names.
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: write
    steps:
      # The title and branch reach the shell only through env: never interpolated into the script.
      - name: 'Retitle to <KEY>: <Summary>'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          PR_BRANCH: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          TICKET_RE: '^(TRS|AIQ|INF)-[0-9]{4,7}'
        run: |
          case "$PR_NUMBER" in ''|*[!0-9]*) echo "::error::pr_number must be a pull request number"; exit 1 ;; esac
          if [ -z "$PR_BRANCH" ]; then
            PR_BRANCH="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefName -q .headRefName)"
            PR_TITLE="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json title -q .title)"
          fi
          key="$(printf '%s\n' "$PR_BRANCH" | grep -oE -e "$TICKET_RE" || true)"
          if [ -z "$key" ]; then echo "no ticket on $PR_BRANCH: title kept"; exit 0; fi
          ticket="${key%%-*}[-_ ]?${key#*-}"
          rest="$PR_TITLE"
          shopt -s nocasematch
          while :; do
            rest="${rest#"${rest%%[![:space:]]*}"}"
            if [[ $rest =~ ^[a-z]+\ ?\(${ticket}\)!?:(.*)$ ]] || [[ $rest =~ ^\[${ticket}\](.*)$ ]] \
              || [[ $rest =~ ^${ticket}([[:space:]:-].*)?$ ]]; then
              rest="${BASH_REMATCH[1]}"
              rest="${rest#"${rest%%[![:space:]:-]*}"}"
            else
              break
            fi
          done
          shopt -u nocasematch
          rest="${rest%"${rest##*[![:space:]]}"}"
          if [ -z "$rest" ]; then rest="${PR_BRANCH#"$key"}"; rest="${rest#-}"; rest="${rest//-/ }"; fi
          [ -n "$rest" ] || rest="$key"
          want="$key: $(printf '%s' "${rest:0:1}" | tr '[:lower:]' '[:upper:]')${rest:1}"
          if [ "$want" = "$PR_TITLE" ]; then echo "title ok: $PR_TITLE"; exit 0; fi
          echo "retitle: $PR_TITLE → $want"
          gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --title "$want"
